databases:
  - name: ps032-db
    databaseName: ps032_digital_twin
    user: ps032_user
    plan: starter

services:
  - type: web
    name: ps032-digital-twin
    runtime: python
    plan: starter
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        fromDatabase:
          name: ps032-db
          property: connectionString
      - key: DT_SECRET_KEY
        generateValue: true
      - key: DT_SIMULATION_AUTOSTART
        value: "false"
      - key: DT_SERVE_FRONTEND
        value: "true"
      - key: DT_COOKIE_SAMESITE
        value: "lax"
      # Optional: if deploying a separate Render Static Site frontend, set DT_CORS_ORIGINS
      # to your Static Site URL (e.g. https://ps032-frontend.onrender.com) and set DT_COOKIE_SAMESITE=none
      - key: DT_CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
