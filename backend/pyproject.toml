[project]
name = "ps032-digital-twin-backend"
version = "0.2.0"
description = "PS-032 Industrial Digital Twin & Smart Shift Handover Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "websockets>=13.0",
    "werkzeug>=3.0.0",
    "reportlab>=4.0.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
